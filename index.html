<body class="min-h-screen flex items-center justify-center">

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen" class="w-full flex items-center justify-center p-4">
        <div class="w-full max-w-sm space-y-4">
            <div class="bg-black border border-neutral-800 p-8 rounded-sm text-center">
                <h1 class="text-5xl font-serif italic mb-8 tracking-wider font-semibold">Instagram</h1>
                <form id="auth-form" class="space-y-3" onsubmit="handleAuth(event)">
                    <input type="text" id="auth-username" placeholder="اسم المستخدم" required 
                        class="w-full px-3 py-2.5 bg-neutral-900 border border-neutral-700 rounded text-xs focus:outline-none focus:border-neutral-400 text-white placeholder-neutral-500">
                    <input type="password" id="auth-password" placeholder="كلمة السر" required 
                        class="w-full px-3 py-2.5 bg-neutral-900 border border-neutral-700 rounded text-xs focus:outline-none focus:border-neutral-400 text-white placeholder-neutral-500">
                    <button type="submit" class="w-full bg-[#0095f6] hover:bg-[#1877f2] text-white py-2 rounded font-semibold text-sm transition mt-2">
                        تسجيل الدخول / إنشاء حساب
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app-screen" class="hidden w-full min-h-screen flex flex-col md:flex-row max-w-6xl mx-auto">
        
        <!-- الشريط الجانبي (Sidebar) مطابق لإنستغرام -->
        <div class="w-full md:w-64 border-t md:border-t-0 md:border-l border-neutral-800 p-2 md:p-4 flex md:flex-col justify-between items-center md:items-start bg-black fixed bottom-0 inset-x-0 md:inset-x-auto md:bottom-auto md:sticky md:top-0 z-50">
            <h1 class="text-2xl font-serif italic hidden md:block mb-6 px-2 cursor-pointer" onclick="switchTab('feed')">Instagram</h1>
            <div class="flex md:flex-col w-full justify-around md:justify-start space-y-0 md:space-y-1 text-sm">
                <button onclick="switchTab('feed')" class="flex items-center space-x-4 space-x-reverse p-3 hover:bg-neutral-900 rounded-lg w-full transition font-medium">
                    <i class="fa-solid fa-house text-xl w-6"></i><span class="hidden md:inline">الصفحة الرئيسية</span>
                </button>
                <button onclick="switchTab('search')" class="flex items-center space-x-4 space-x-reverse p-3 hover:bg-neutral-900 rounded-lg w-full transition font-medium">
                    <i class="fa-solid fa-magnifying-glass text-xl w-6"></i><span class="hidden md:inline">بحث واستكشاف</span>
                </button>
                <button onclick="switchTab('reels')" class="flex items-center space-x-4 space-x-reverse p-3 hover:bg-neutral-900 rounded-lg w-full transition font-medium">
                    <i class="fa-solid fa-clapperboard text-xl w-6"></i><span class="hidden md:inline">ريلز</span>
                </button>
                <button onclick="switchTab('chat')" class="flex items-center space-x-4 space-x-reverse p-3 hover:bg-neutral-900 rounded-lg w-full transition font-medium relative">
                    <i class="fa-solid fa-paper-plane text-xl w-6"></i><span class="hidden md:inline">الرسائل</span>
                    <span id="nav-badge-requests" class="absolute top-2 right-2 md:right-auto md:left-4 bg-red-500 text-white text-[10px] px-1.5 rounded-full hidden">0</span>
                </button>
                <button onclick="switchTab('profile')" class="flex items-center space-x-4 space-x-reverse p-3 hover:bg-neutral-900 rounded-lg w-full transition font-medium">
                    <i class="fa-solid fa-circle-user text-xl w-6"></i><span class="hidden md:inline">الملف الشخصي</span>
                </button>
            </div>
            <button onclick="logout()" class="hidden md:flex items-center space-x-4 space-x-reverse p-3 text-red-500 hover:bg-neutral-900 rounded-lg w-full transition mt-auto font-medium">
                <i class="fa-solid fa-right-from-bracket text-xl w-6"></i><span>تسجيل الخروج</span>
            </button>
        </div>

        <!-- المحتوى الأساسي -->
        <div class="flex-1 p-2 md:p-6 pb-20 md:pb-6 overflow-y-auto max-h-screen">
            
            <!-- 1. الفيد والستوريات (Feed) -->
            <div id="tab-feed" class="max-w-md mx-auto space-y-6 py-4">
                <!-- شريط الستوريات -->
                <div class="bg-neutral-900 border border-neutral-800 p-3 rounded-xl flex space-x-4 space-x-reverse overflow-x-auto items-center" id="stories-container">
                    <div class="flex flex-col items-center cursor-pointer flex-shrink-0" onclick="document.getElementById('story-file').click()">
                        <div class="w-16 h-16 rounded-full border-2 border-[#0095f6] flex items-center justify-center bg-black text-xl">
                            <i class="fa-solid fa-plus"></i>
                        </div>
                        <span class="text-[10px] mt-1">قصتك</span>
                        <input type="file" id="story-file" accept="image/*,video/*" class="hidden" onclick="event.stopPropagation()" onchange="uploadStory(event)">
                    </div>
                </div>

                <!-- صندوق نشر منشور جديد -->
                <div class="bg-neutral-900 border border-neutral-800 p-4 rounded-xl space-y-3">
                    <h3 class="font-semibold text-sm text-neutral-300">إنشاء منشور جديد</h3>
                    <input type="text" id="post-caption" placeholder="اكتب تعليقاً على المنشور..." class="w-full p-2.5 bg-black border border-neutral-800 rounded text-sm focus:outline-none">
                    <input type="file" id="post-file" accept="image/*,video/*" class="w-full text-xs text-neutral-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-[#0095f6] file:text-white cursor-pointer">
                    <button onclick="createPost()" class="w-full bg-[#0095f6] hover:bg-[#1877f2] text-white p-2 rounded text-sm font-semibold transition">نشر المنشور</button>
                </div>

                <!-- عرض المنشورات -->
                <div id="posts-container" class="space-y-6"></div>
            </div>

            <!-- 2. تبويب البحث (Search) -->
            <div id="tab-search" class="hidden max-w-md mx-auto space-y-4 py-6">
                <input type="text" id="search-user-input" placeholder="ابحث عن المستخدمين لمتابعتهم..." oninput="searchUsers()" class="w-full p-2.5 bg-neutral-900 border border-neutral-700 rounded-lg text-xs text-white focus:outline-none">
                <div id="search-results" class="space-y-3"></div>
            </div>

            <!-- 3. تبويب الريلز (Reels) -->
            <div id="tab-reels" class="hidden max-w-md mx-auto space-y-6 py-4">
                <h2 class="font-bold text-base mb-4">فيديوهات الريلز</h2>
                <div id="reels-container" class="space-y-6"></div>

          '<div class="flex items-center gap-3">' +
          '<div class="w-10 h-10 rounded-full bg-neutral-700 flex items-center justify-center font-bold uppercase text-xs">' + avatar + '</div>' +
          '<div class="text-xs"><p class="font-semibold text-white">' + uname + '</p><p class="text-[10px] text-blue-400">يريد مراسلتك (طلب مراسلة)</p></div></div>' +
          '<button onclick="toggleFollow(\'' + uname + '\'); event.stopPropagation();" class="bg-[#0095f6] text-white px-3 py-1 rounded text-[10px]">متابعة</button></div>';
      }
    }
  }
  $('requests-count').innerText = requestCount;
  var badge = $('nav-badge-requests');
  if (requestCount > 0) { badge.innerText = requestCount; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
  $('chat-list-container').innerHTML = (currentChatSubTab === 'primary' ? primaryHtml : requestHtml) ||
    '<p class="text-center text-neutral-500 text-xs p-4">لا توجد ' + (currentChatSubTab === 'primary' ? 'محادثات' : 'طلبات مراسلة') + '</p>';
}
window.selectChatPartner = function (partner) {
  activeChatPartner = partner;
  $('active-chat-header').innerHTML = '<span>محادثة مع: <strong>' + partner + '</strong></span>';
  $('chat-input-area').classList.remove('hidden');
  loadData();
};
window.sendMessage = function () {
  var text = $('chat-input').value.trim();
  if (!text || !activeChatPartner) return;
  var to = activeChatPartner;
  return getDB().then(function (db) {
    db.messages = db.messages || [];
    db.messages.push({ sender: currentUser, receiver: to, text: text, time: new Date().toLocaleTimeString() });
    return updateDB(db);
  }).then(function () { $('chat-input').value = ''; });
};
function renderMessages(ms) {
  var c = $('chat-messages'), p = activeChatPartner, near = c.scrollHeight - c.scrollTop - c.clientHeight < 80, h = '';
  for (var i = 0; i < ms.length; i++) {
    var m = ms[i];
    if (!((m.sender === currentUser && m.receiver === p) || (m.sender === p && m.receiver === currentUser))) continue;
    var me = m.sender === currentUser;
    h += '<div class="flex flex-col ' + (me ? 'items-end' : 'items-start') + ' mb-2"><span class="text-[9px] text-neutral-500 mb-0.5 px-1">' + esc(m.time || '') + '</span><div class="p-2.5 rounded-2xl text-xs max-w-[75%] break-words ' + (me ? 'bg-[#0095f6] text-white rounded-br-sm' : 'bg-neutral-800 text-neutral-200 rounded-bl-sm') + '">' + esc(m.text) + '</div></div>';
  }
  c.innerHTML = h || '<p class="text-center text-neutral-500 text-xs my-auto">ابدأ المحادثة الآن.</p>';
  if (near || c.getAttribute('data-p') !== p) { c.scrollTop = c.scrollHeight; c.setAttribute('data-p', p); }
}
$('chat-input').addEventListener('keydown', function (e) { if (e.keyCode === 13) sendMessage(); }, false);


/* ===== الإشعارات ===== */
var NT = { origTitle: document.title, unread: 0 };
function hasNative() { return typeof window.Notification !== 'undefined'; }
function ntBeep() {
  try {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    var c = new AC(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = 0.08;
    o.start(0); setTimeout(function () { try { o.stop(0); if (c.close) c.close(); } catch (e) {} }, 160);
  } catch (e) {}
}
function ntToast(title, body, fn) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:10px;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);width:92%;max-width:360px;background:#262626;border:1px solid #404040;border-radius:14px;padding:12px 14px;z-index:9999;color:#fff;font-size:13px;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.6)';
  var b = document.createElement('b'); b.textContent = title;
  var p = document.createElement('div'); p.style.cssText = 'color:#d4d4d4;margin-top:2px;word-wrap:break-word'; p.textContent = body;
  t.appendChild(b); t.appendChild(p);
  function close() { if (t.parentNode) t.parentNode.removeChild(t); }
  t.onclick = function () { close(); if (fn) fn(); };
  document.body.appendChild(t);
  setTimeout(close, 6000);
}
function ntNative(title, body, tag) {
  if (!hasNative() || Notification.permission !== 'granted') return;
  var opts = { body: body, tag: tag, dir: 'rtl', lang: 'ar' };
  try { new Notification(title, opts); return; } catch (e) {}
  // أندرويد: لازم عن طريق Service Worker
  try {
    navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.showNotification(title, opts); });
  } catch (e2) {}
}
function ntFire(title, body, tag, fn) {
  var hidden = document.hidden === true;
  if (!hidden) ntToast(title, body, fn);
  ntNative(title, body, tag);
  if (navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
  ntBeep();
  if (hidden) { NT.unread++; document.title = '(' + NT.unread + ') ' + NT.origTitle; }
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { NT.unread = 0; document.title = NT.origTitle; }
}, false);

function checkNotifs(db) {
  if (!currentUser) return;
  var k = 'insta_n_' + currentUser, i;
  var mine = (db.messages || []).filter(function (m) { return m.receiver === currentUser; });
  var me = (db.users && db.users[currentUser]) || {}, fol = me.followers || [];
  var sm = lsGet(k + '_m'), sf = lsGet(k + '_f');
  if (sm === null || sf === null) {            // أول مرة: نسجّل الوضع الحالي بلا إشعارات قديمة
    lsSet(k + '_m', String(mine.length)); lsSet(k + '_f', JSON.stringify(fol)); return;
  }
  var oldN = parseInt(sm, 10) || 0;
  if (mine.length < oldN) oldN = mine.length;
  for (i = oldN; i < mine.length; i++) {
    (function (m) {
      var viewing = activeChatPartner === m.sender && !$('tab-chat').classList.contains('hidden') && !document.hidden;
      if (viewing) return;
      ntFire('رسالة جديدة من ' + m.sender, m.text, 'msg-' + m.sender, function () { switchTab('chat'); selectChatPartner(m.sender); });
    })(mine[i]);
  }
  lsSet(k + '_m', String(mine.length));
  var oldF = []; try { oldF = JSON.parse(sf) || []; } catch (e) {}
  for (i = 0; i < fol.length; i++) {
    if (oldF.indexOf(fol[i]) < 0) (function (u) { ntFire('متابع جديد', u + ' بدأ يتابعك', 'fol-' + u, function () { viewProfile(u); }); })(fol[i]);
  }
  lsSet(k + '_f', JSON.stringify(fol));
}

/* شريط طلب إذن الإشعارات (لازم يكون بضغطة من المستخدم) */
function showNotifBanner() {
  if (!hasNative() || Notification.permission !== 'default' || $('notif-banner')) return;
  var d = document.createElement('div'); d.id = 'notif-banner';
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:#0095f6;color:#fff;font-size:13px;padding:10px 12px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between';
  d.innerHTML = '<span>فعّل الإشعارات باش توصلك الرسائل</span><span><button id="notif-yes" style="background:#fff;color:#0095f6;border-radius:6px;padding:4px 10px;font-weight:600;margin-left:6px">تفعيل</button><button id="notif-no" style="color:#fff;padding:4px 8px">لاحقاً</button></span>';
  document.body.appendChild(d);
  $('notif-no').onclick = function () { d.parentNode.removeChild(d); };
  $('notif-yes').onclick = function () {
    try {
      var r = Notification.requestPermission(function () {});
      if (r && r.then) r.then(function () {});
    } catch (e) {}
    d.parentNode.removeChild(d);
  };
}
function initNotifs() {
  try {
    if (navigator.serviceWorker && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js')['catch'](function () {});
  } catch (e) {}
  setTimeout(showNotifBanner, 1500);
}

/* ===== البداية ===== */
if (currentUser) { showApp(); initNotifs(); }
</script>
